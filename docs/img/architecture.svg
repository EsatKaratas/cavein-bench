<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="866" viewBox="0 0 1200 866" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">CaveIn architecture</title><desc id="d">Scenario files drive the CaveIn harness, which talks to any agent over a JSON-lines protocol. Every model call goes through Bifrost to Gemini. Scoring pulls Bifrost logs, runs deterministic checks and an LLM judge, stores results in SQLite and shows them in a Streamlit dashboard.</desc>
<defs><marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="a-vio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b21b6"/></marker><marker id="a-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker></defs>
<rect x="0" y="0" width="1200" height="866" rx="16" fill="#ffffff"/>
<text x="32" y="52" font-size="26" fill="#0f172a" font-weight="700" text-anchor="start">CaveIn — system architecture</text>
<text x="32" y="80" font-size="15" fill="#475569" font-weight="normal" text-anchor="start">Any agent, any runtime. Every model call goes through Bifrost, so the benchmark gets tokens, cost, latency and failover without an SDK in the agent.</text>
